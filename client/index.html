<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab01 Transaction Client</title>
  <style>
    :root { color-scheme:light; font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#f4f6f8; color:#17202a; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; }
    .page { max-width:1180px; margin:auto; }
    .page-header { display:flex; justify-content:space-between; gap:20px; align-items:end; margin-bottom:16px; }
    h1 { margin:0; font-size:1.6rem; } h2 { margin:0; font-size:1.08rem; } h3 { margin:0; font-size:.88rem; }
    .hint { margin:5px 0 0; color:#647180; font-size:.84rem; }
    .layout { display:grid; grid-template-columns:minmax(360px,1fr) minmax(480px,1.35fr); gap:16px; align-items:start; }
    .card { background:#fff; border:1px solid #d9e0e7; border-radius:14px; padding:18px; box-shadow:0 6px 20px #17202a0d; }
    .section + .section { border-top:1px solid #e6ebef; margin-top:17px; padding-top:17px; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    label { display:block; margin-top:11px; font-size:.86rem; font-weight:650; }
    input, textarea, button { font:inherit; }
    input, textarea { width:100%; margin-top:5px; padding:9px 11px; border:1px solid #b8c4ce; border-radius:8px; background:#fff; }
    input:focus, textarea:focus { outline:2px solid #1769e033; border-color:#1769e0; }
    textarea { height:92px; resize:none; }
    .owner { margin-top:6px; overflow-wrap:anywhere; background:#f2f5f7; padding:8px 10px; border-radius:8px; font:12px ui-monospace,monospace; }
    .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    button { border:0; border-radius:8px; padding:9px 13px; cursor:pointer; background:#1769e0; color:#fff; font-weight:650; font-size:.86rem; }
    button.secondary { background:#52606d; } button.ghost { background:#e9eef3; color:#273444; }
    button:disabled { opacity:.55; cursor:wait; }
    pre { margin:8px 0 0; white-space:pre-wrap; overflow:auto; overflow-wrap:anywhere; background:#101820; color:#d9f7e8; padding:11px; border-radius:8px; font-size:.8rem; line-height:1.45; }
    #output { min-height:104px; max-height:205px; }
    .monitor-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .state-panel { margin-top:16px; }
    .state-summary { margin:7px 0 12px; padding:8px 10px; border-radius:8px; background:#eef5ff; color:#284b75; overflow-wrap:anywhere; }
    .state-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(230px,.8fr); gap:12px; }
    .table-card { min-width:0; }
    .table-wrap { max-height:330px; overflow:auto; border:1px solid #d9e0e7; border-radius:8px; margin-top:7px; }
    table { width:100%; border-collapse:separate; border-spacing:0; font-size:.78rem; }
    th, td { padding:8px; text-align:left; vertical-align:top; border-bottom:1px solid #e5eaee; }
    th { position:sticky; top:0; z-index:1; background:#f2f5f7; white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    td.mono { max-width:220px; font-family:ui-monospace,monospace; overflow-wrap:anywhere; }
    .secure-note { text-align:right; max-width:360px; }
    @media (min-width:901px) {
      body { overflow:hidden; }
      .left-card, .right-card { height:calc(100vh - 112px); min-height:0; display:flex; flex-direction:column; overflow:hidden; }
      .transaction-section { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      .value-field { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      .value-field textarea { flex:1 1 auto; min-height:92px; height:auto; }
      .right-card > #output { flex:0 0 auto; }
      .state-panel { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      .state-panel[hidden] { display:none; }
      .state-grid { flex:1 1 auto; min-height:0; }
      .table-card { display:flex; flex-direction:column; min-height:0; }
      .table-wrap { flex:1 1 auto; min-height:0; max-height:none; }
    }
    @media (max-width:900px) {
      body { padding:14px; } .layout { grid-template-columns:1fr; }
      .state-grid { grid-template-columns:1fr; } .table-wrap { max-height:260px; }
      .secure-note { display:none; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Lab01 Transaction Client</h1><p class="hint">Ví Ed25519 test-only, private key chỉ nằm trong browser</p></div>
    <p class="hint secure-note">Yêu cầu cho phép trình duyệt truy cập mạng nội bộ.</p>
  </header>

  <main class="layout">
    <section class="card left-card">
      <div class="section">
        <div class="section-title"><h2>1. Thiết lập</h2></div>
        <label>Node URL<input id="nodeUrl" value="" placeholder="http://192.168.1.66:31000"></label>
        <label>Owner public key</label>
        <div class="owner" id="owner">Đang tạo ví…</div>
      </div>

      <div class="section transaction-section">
        <div class="section-title"><h2>2. Gửi transaction</h2></div>
        <label>Key<input id="record" value="message" maxlength="256"></label>
        <label class="value-field">Value<textarea id="value">hello blockchain</textarea></label>
        <div class="actions">
          <button id="send">Gửi</button>
          <button id="newWallet" class="ghost">Tạo mới</button>
        </div>
      </div>
    </section>

    <section class="card right-card">
      <div class="section-title">
        <h2>Kết quả gần nhất</h2>
        <div class="monitor-actions">
          <button id="status" class="secondary">Làm mới status</button>
          <button id="state" class="secondary">Tải committed state</button>
        </div>
      </div>
      <pre id="output">Sẵn sàng.</pre>

      <section id="statePanel" class="state-panel" hidden>
        <h2>Committed state</h2>
        <p id="stateSummary" class="hint state-summary"></p>
        <div class="state-grid">
          <div class="table-card">
            <h3>Key-value</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Owner</th><th>Key</th><th>Value</th></tr></thead>
              <tbody id="recordRows"></tbody>
            </table></div>
          </div>
          <div class="table-card">
            <h3>Client nonce</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Client public key</th><th>Nonce</th></tr></thead>
              <tbody id="accountRows"></tbody>
            </table></div>
          </div>
        </div>
      </section>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
